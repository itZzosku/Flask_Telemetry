<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Shooting Diary</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shooting Diary">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#eef0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141714" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="static/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="static/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: single-column range log; licence strip + totals up top, entries by month, entry sheet over the log. */
:root{
  --bg:#eef0ec; --surface:#ffffff; --surface-2:#e3e6e0; --line:#c9cec4;
  --fg:#1c211c; --muted:#5b6359; --accent:#e2590f; --accent-ink:#ffffff; --accent-soft:#fbe3d4;
  --danger:#b3261e;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141714; --surface:#1d211d; --surface-2:#272c27; --line:#363d36;
  --fg:#e8ebe6; --muted:#9aa398; --accent:#ff7a33; --accent-ink:#1a0d05; --accent-soft:#3a2416;
  --danger:#ff8a80; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141714; --surface:#1d211d; --surface-2:#272c27; --line:#363d36;
  --fg:#e8ebe6; --muted:#9aa398; --accent:#ff7a33; --accent-ink:#1a0d05; --accent-soft:#3a2416;
  --danger:#ff8a80; color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
[hidden]{display:none!important}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(120px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header.top{padding-top:20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:min(2.4rem,7.6vw);line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
h1 span{color:var(--accent)}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.85rem;color:var(--fg)}
.ghost:hover{border-color:var(--fg)}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-size:.9rem}

/* Licence strip */
.ids{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 16px;padding:12px 0;border-top:2px solid var(--fg)}
.ids div{min-width:0}
.ids small,.lbl{display:block;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.ids b{font-weight:600;overflow-wrap:anywhere}
.ids .num{font-weight:600}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:12px 4px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat+.stat{border-left:1px solid var(--line);padding-left:12px}
.stat b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.7rem;font-weight:600;line-height:1.1}
.stat small{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}
.types{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9rem;padding-top:10px}
.types span{color:var(--muted)}
.types b{font-family:var(--f-mono);font-weight:600;color:var(--fg)}

h2{font-family:var(--f-display);font-weight:700;font-size:1.35rem;text-transform:uppercase;letter-spacing:.04em;margin:0}
.loghead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.yrs{display:flex;gap:6px;flex-wrap:wrap}
.search{position:relative;margin-bottom:12px}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:11px 40px 11px 16px;font-size:1rem;color:var(--fg)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:var(--surface-2);color:var(--muted);font-size:1rem;line-height:1}
.found{font-size:.85rem;color:var(--muted);margin:-4px 0 12px}
.found b{color:var(--fg);font-family:var(--f-mono)}
.yr{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:.82rem;font-family:var(--f-mono)}
.yr[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.month{font-family:var(--f-display);font-weight:600;font-size:1rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px;display:flex;justify-content:space-between}
.month:first-child{margin-top:0}

.entry{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px}
.entry:hover{border-color:var(--muted)}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-right:1px solid var(--line);padding-right:10px}
.day b{font-family:var(--f-mono);font-size:.92rem;font-weight:600;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
.day small{font-size:.72rem;color:var(--muted)}
.e-head{display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap}
.e-place{font-weight:600}
.e-meta{color:var(--muted);font-size:.85rem}
.e-lines{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:.88rem}
.e-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.e-line .what{min-width:0;overflow-wrap:anywhere}
.e-line .what span{color:var(--muted)}
.e-line .num{font-weight:600}
.tm{display:inline-block;font-family:var(--f-mono);font-size:.72rem;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:4px;color:var(--muted)}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted)}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:16px 28px;
  font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:.06em;text-transform:uppercase;
  box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:5;white-space:nowrap}

/* Sheets */
.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.sheet-bar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding-block:12px;z-index:1;border-bottom:1px solid var(--line)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=date],input[type=time],input[type=number],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px;font-size:1rem;color:var(--fg);font-weight:400;text-transform:none;letter-spacing:0;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.add{border-style:dashed}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:12px}

.line{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 4px 0 0 var(--accent)}
.line-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.line-top .lbl{font-size:.75rem}
.rm{background:none;border:0;color:var(--muted);font-size:.85rem;padding:4px 6px}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.step{display:flex;align-items:center;gap:4px}
.step button{width:44px;height:44px;flex:0 0 44px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:1.3rem;line-height:1}
.step input{text-align:center;font-family:var(--f-mono);font-weight:600}
.total{font-family:var(--f-mono);font-size:.9rem;color:var(--muted);text-align:right}

.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:14px 22px;font-weight:600;font-size:1rem;flex:1 1 auto}
.danger{background:none;border:1px solid var(--danger);color:var(--danger);border-radius:8px;padding:13px 16px}
.msg{font-size:.88rem;color:var(--danger)}
.opt{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.opt>label.r{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.opt input[type=radio]{width:20px;height:20px;accent-color:var(--accent)}
.opt .sub{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding-left:30px}
.hint{font-size:.85rem;color:var(--muted)}
.hint b{color:var(--fg);font-family:var(--f-mono)}
/* Guns */
.guns{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.gunrow{display:grid;grid-template-columns:36px minmax(0,1fr);align-items:stretch;border-top:1px solid var(--line);background:var(--surface)}
.gunrow:first-child{border-top:0;border-radius:var(--r) var(--r) 0 0}
.gunrow:last-child{border-radius:0 0 var(--r) var(--r)}
.grip{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:1.1rem;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.gunrow.dragging{position:relative;z-index:2;box-shadow:0 6px 18px rgba(0,0,0,.18);background:var(--surface-2)}
.gunrow.dragging .grip{cursor:grabbing;color:var(--accent)}
.gun{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 14px 12px 0}
.gun:hover{background:var(--surface-2)}
.gun b{font-weight:600}
.gun .g-sub{color:var(--muted);font-size:.82rem;grid-column:1}
.gun .g-r{grid-row:1/3;grid-column:2;text-align:right}
.gun .g-r .num{font-size:1.3rem;font-weight:600;display:block;line-height:1.1}
.gun .g-r small{color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em}
.gun.archived{opacity:.55}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.toggle{display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:4px 0;color:var(--fg);text-align:left}
.toggle .cnt{font-size:.85rem;color:var(--muted)}
.toggle .chev{display:inline-block;color:var(--muted);transition:transform .15s}
.toggle[aria-expanded="true"] .chev{transform:rotate(90deg)}
.check{display:flex;gap:10px;align-items:center;font-size:.95rem;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.e-line .gname{color:var(--fg);font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:20}

@media (max-width:560px){ .ids{grid-template-columns:repeat(2,minmax(0,1fr))} .grid3{grid-template-columns:1fr 1fr} .grid3>:first-child{grid-column:1/-1} }
@media (max-width:420px){ .stat b{font-size:1.35rem} .lgrid{grid-template-columns:1fr} }
@media (prefers-reduced-motion:no-preference){ .toast{animation:up .2s ease-out} @keyframes up{from{opacity:0;transform:translate(-50%,8px)}} }
/* Page switcher (same on every page) */
.pnav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;margin-top:max(12px,env(safe-area-inset-top,0px))}
.pnav a{display:flex;align-items:center;justify-content:center;gap:5px;min-height:38px;padding:4px 6px;border-radius:999px;color:var(--fg);text-decoration:none;font-weight:600;font-size:.86rem;white-space:nowrap;overflow:hidden}
.pnav a:hover{background:var(--surface)}
.pnav a[aria-current="page"]{background:var(--fg);color:var(--bg)}
.pnav svg{width:16px;height:16px;flex:0 0 auto}
header.top{padding-top:6px!important}
/* ---- landing page ---- */
.who{color:var(--muted);font-size:.9rem;margin-top:6px}
.tiles{display:flex;flex-direction:column;gap:12px}
.tile{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 14px;align-items:center;text-decoration:none;color:var(--fg);
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 16px 14px;box-shadow:inset 4px 0 0 var(--accent)}
.tile:hover{border-color:var(--muted)}
.tile:active{background:var(--surface-2)}
.tile .ic{grid-row:1/3;width:52px;height:52px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:28px;height:28px}
.tile b{font-family:var(--f-display);font-weight:700;font-size:1.55rem;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.tile .go{grid-row:1/3;grid-column:3;color:var(--muted);font-size:1.4rem}
.tile .what{grid-column:2;color:var(--muted);font-size:.86rem;line-height:1.35}
.tile .now{grid-column:1/-1;margin-top:8px;padding-top:10px;border-top:1px solid var(--line);font-size:.88rem;line-height:1.4;min-height:1.4em}
.tile .now b{font-family:var(--f-mono);font-size:.9rem;font-weight:600;text-transform:none;letter-spacing:0}
.tile .now span{color:var(--muted)}
.foot{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <nav class="pnav" aria-label="Pages"><a href="./" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>Home</span></a><a href="log">Diary</a><a href="velocity">Velocity</a><a href="zeroes">Zeroes</a></nav>
  <header class="top">
    <div><h1>Shooting <span>diary</span></h1><div class="who" id="who"></div></div>
    <div class="hbtns">
      <button class="ghost" id="installBtn" type="button" hidden>Install app</button>
      <form method="post" action="logout" style="display:contents"><button class="ghost" type="submit">Log out</button></form>
    </div>
  </header>
  <div class="banner" id="offNote" hidden>Offline – showing the last summary fetched.</div>

  <nav class="tiles" aria-label="Sections">
    <a class="tile" href="log">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M9 9h7M9 13h7M9 17h4"/></svg></span>
      <b>Diary</b><span class="go" aria-hidden="true">›</span>
      <span class="what">Range visits, shots per gun, licence export</span>
      <span class="now" id="nDiary"></span>
    </a>
    <a class="tile" href="velocity">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-6 4 3 5-7 4 4"/><path d="M3 21h18"/></svg></span>
      <b>Velocity</b><span class="go" aria-hidden="true">›</span>
      <span class="what">Garmin Xero strings, loads, trends</span>
      <span class="now" id="nVel"></span>
    </a>
    <a class="tile" href="zeroes">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/></svg></span>
      <b>Zeroes</b><span class="go" aria-hidden="true">›</span>
      <span class="what">Scope dial positions and swaps</span>
      <span class="now" id="nZero"></span>
    </a>
  </nav>
</div>
<div class="toast" id="toast" hidden></div>
<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fiDate=s=>{if(!s)return"";const[y,m,d]=s.split("-").map(Number);return d+"/"+m+"/"+y};
const nf=n=>String(Number(n||0));             // plain digits: 2242
async function load(){
  let r,j;
  try{r=await fetch("api/home",{credentials:"same-origin",headers:{"X-Requested-With":"fetch"}})}catch(e){return}
  if(r.status===401){location.href="login";return}
  $("offNote").hidden=!r.headers.get("X-Offline");
  try{j=await r.json()}catch(e){return}
  if(!r.ok)return;
  $("who").textContent=j.name||"";
  const d=j.diary,v=j.velocity,z=j.zeroes||[];
  $("nDiary").innerHTML=`<b>${d.visits}</b> <span>visits in ${d.year} ·</span> <b>${nf(d.rounds)}</b> <span>shots</span>`
    +(d.last?`<br><span>Last:</span> ${fiDate(d.last.date)}${d.last.place?" · "+esc(d.last.place):""}`:"");
  $("nVel").innerHTML=v.last?`<b>${v.last.avg!=null?v.last.avg.toFixed(1):"–"}</b> <span>m/s ⌀ · n ${v.last.n}${v.last.sd!=null?" · SD "+v.last.sd.toFixed(2):""} · ${fiDate(v.last.date)}</span><br>${esc([v.last.load,v.last.gun].filter(Boolean).join(" · "))||"<span>No load</span>"}`
    :`<span>No velocities yet.</span>`;
  $("nZero").innerHTML=z.length?z.map(s=>`${esc(s.name)} <span>·</span> ${s.on?`<span>on</span> <b>${esc(s.on)}</b>`:`<span>${s.positions} positions</span>`}`).join("<br>")
    :`<span>No scopes yet.</span>`;
}
load();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load()});

let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;$("installBtn").hidden=false});
window.addEventListener("appinstalled",()=>{installEvt=null;$("installBtn").hidden=true});
$("installBtn").addEventListener("click",async()=>{if(!installEvt)return;installEvt.prompt();await installEvt.userChoice;installEvt=null;$("installBtn").hidden=true});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(()=>{});
})();
</script>
</body>
</html>
